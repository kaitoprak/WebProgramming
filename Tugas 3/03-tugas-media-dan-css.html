<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemutar Media Kuliah</title>
    <link rel="stylesheet" href="03-tugas-style.css">
</head>

<body>
    <main class="media-card media-card--featured">
        <header class="media-card__header">
            <p class="media-card__label">Materi Kuliah</p>
            <h1 class="media-card__title"> Pengantar Pemrograman Web </h1>
        </header>
        <div class="media-card__cover">
            <picture>
                <source media="(min-width: 768px)" srcset="assets/images/kuliah-desktop.webp" type="image/webp">
                <source media="(max-width: 767px)" srcset="assets/images/kuliah-mobile.webp" type="image/webp"> <img
                    src="assets/images/kuliah-mobile.webp" alt="Ilustrasi sampul materi Pengantar Pemrograman Web">
            </picture>
        </div>
        <section class="media-card__content">
            <p class="media-card__description"> Materi pembelajaran mengenai dasar-dasar pengembangan aplikasi web
                menggunakan HTML, CSS, dan JavaScript. </p>
            <p class="media-card__meta"> Modul 3 &bull; Pemrograman Web </p>
        </section>
        <section class="media-card__video">
            <h2 class="media-card__subtitle">Video Pembelajaran</h2> <video controls
                poster="https://placehold.co/800x450"> <!-- Format video akan ditambahkan pada tahap berikutnya -->
                Browser Anda tidak mendukung pemutar video. </video>
        </section>
        <section class="media-card__audio">
            <h2 class="media-card__subtitle">Audio Materi</h2> <audio controls> Browser Anda tidak mendukung pemutar
                audio. </audio>
        </section>
    </main>

</body>

</html>
